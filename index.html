<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP Geolocator</title>

    <link rel="stylesheet" href="styles.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>

    <main class="main">
        <section class="main__center">

            <div class="main__center-geolocate">
                <form>

                    <input type="text" name="ip_address" id="ip_address_id" placeholder="IP Address">

                    <button type="button" onclick="geolocate()">Geolocate</button>

                </form>
            </div>

            <div class="main__center-infos">

                <div class="main__center-infos__none"><p><i class="fa-solid fa-info-circle"></i>No Results</p></div>

                <div class="main__center-infos__list">

                    <!-- <div class="info"><p>Info</p><p>Value</p></div> -->

                </div>

            </div>

        </section>
    </main>

    <script type="text/javascript" src="main.js"></script>
    
</body>
</html>
